name: build
on:
  push:
    branches: ["**"]
    paths: ["native/**", "tools/**", ".github/workflows/build.yml", ".gitmodules"]
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { shell: pwsh } }

jobs:
  mod:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BUILD_MODE: Game__Shipping__Win64
      BUILD_DIR: build_mod
    steps:
      # Le token réécrit les URL git@github.com: des sous-modules (UEPseudo privé) en HTTPS.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.UEPSEUDO_PAT }}

      - name: Cache key
        id: key
        run: |
          $s = (git submodule status --recursive) -join "`n"
          $h = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($s))).Replace("-","").Substring(0,16)
          "sub=$h" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build_deps/_deps
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ runner.os }}-${{ steps.key.outputs.sub }}
          restore-keys: deps-${{ runner.os }}-

      - uses: actions/cache@v4
        id: cache_build
        with:
          path: |
            ${{ env.BUILD_DIR }}
            !${{ env.BUILD_DIR }}/_deps
          key: build-${{ env.BUILD_MODE }}-${{ steps.key.outputs.sub }}-${{ hashFiles('native/mod/**', 'native/common/**', 'native/CMakeLists.txt') }}
          restore-keys: build-${{ env.BUILD_MODE }}-${{ steps.key.outputs.sub }}-

      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64, vsversion: "18" }
      - uses: jwlawson/actions-setup-cmake@v2
        with: { cmake-version: "latest" }
      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: |
          $env:FETCHCONTENT_BASE_DIR = "${{ github.workspace }}/build_deps/_deps"
          cmake -S native -B $env:BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE="$env:BUILD_MODE" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: |
          cmake --build $env:BUILD_DIR --target UE4SS proxy E33Coop

      - name: Stage
        run: |
          $f = { param($n) Get-ChildItem $env:BUILD_DIR -Recurse -Filter $n | Where-Object FullName -notlike '*_deps*' | Select-Object -First 1 }
          New-Item -ItemType Directory -Force pkg/ue4ss/Mods/E33Coop/dlls | Out-Null
          Copy-Item (& $f dwmapi.dll).FullName pkg/
          Copy-Item (& $f UE4SS.dll).FullName pkg/ue4ss/
          Copy-Item (& $f E33Coop.dll).FullName pkg/ue4ss/Mods/E33Coop/dlls/main.dll
          $pdb = & $f E33Coop.pdb; if ($pdb) { Copy-Item $pdb.FullName pkg/ue4ss/Mods/E33Coop/dlls/main.pdb }
          "ue4ss=$(git -C native/third_party/RE-UE4SS rev-parse HEAD)`nmod=${{ github.sha }}" | Set-Content pkg/build-info.txt
          Get-ChildItem pkg -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: e33coop-mod
          path: pkg/
          retention-days: 14
