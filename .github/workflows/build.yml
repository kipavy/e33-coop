name: build
on:
  push:
    branches: ["**"]
    paths: ["native/**", "tools/fakepeer/**", "tools/tests/**", "tools/installer/**", "tools/CMakeLists.txt", "VERSION", ".github/workflows/build.yml", ".gitmodules"]
  workflow_dispatch: {}
  workflow_call: {}   # release.yml : même build, en mode release (Game__Shipping__Win64 / Release)
permissions: { contents: read }
concurrency: { group: "build-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: false }
defaults: { run: { shell: pwsh } }

jobs:
  tools:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64, vsversion: "18" }
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -S tools -B build_tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
      - name: Build
        run: cmake --build build_tools
      - name: Unit tests
        run: ctest --test-dir build_tools --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: e33coop-tools
          path: |
            build_tools/fakepeer.exe
            build_tools/test_protocol.exe
            build_tools/Installer E33 Coop.exe
          retention-days: 14

  mod:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BUILD_MODE: Game__Shipping__Win64
      BUILD_DIR: build_mod
    steps:
      # Le token réécrit les URL git@github.com: des sous-modules (UEPseudo privé) en HTTPS.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.UEPSEUDO_PAT }}
          fetch-depth: 0   # historique complet : diff avec le commit du cache de build

      - name: Cache key
        id: key
        run: |
          # SHA + chemin seulement : la description entre parenthèses dépend des tags récupérés.
          $s = ((git submodule status --recursive) | ForEach-Object { ($_.Trim().TrimStart('-', '+') -split '\s+')[0..1] -join ' ' }) -join "`n"
          $h = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($s))).Replace("-","").Substring(0,16)
          "sub=$h" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build_deps/_deps
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ runner.os }}-${{ steps.key.outputs.sub }}
          restore-keys: deps-${{ runner.os }}-

      - uses: actions/cache@v4
        id: cache_build
        with:
          path: |
            ${{ env.BUILD_DIR }}
            !${{ env.BUILD_DIR }}/_deps
          # Une clé par commit : chaque build sauvegarde son état ; le suivant repart du plus récent.
          key: build-${{ env.BUILD_MODE }}-${{ steps.key.outputs.sub }}-${{ github.sha }}
          restore-keys: build-${{ env.BUILD_MODE }}-${{ steps.key.outputs.sub }}-

      # Ninja compare les dates : après un checkout, tous les fichiers sont « neufs » et tout serait recompilé
      # (UE4SS compris). On date tout au 2001-01-01, puis on remet « maintenant » uniquement sur les fichiers
      # modifiés depuis le commit du cache restauré (les sous-modules sont couverts par la clé).
      - name: Restore file dates for incremental build
        run: |
          $old = [datetime]'2001-01-01'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $n = 0
          foreach ($f in [IO.Directory]::EnumerateFiles("${{ github.workspace }}", "*", [IO.SearchOption]::AllDirectories)) {
            if ($f -match '[\\/](build_mod|build_deps|build_tools|\.git)[\\/]') { continue }
            try { [IO.File]::SetLastWriteTimeUtc($f, $old); $n++ } catch {}
          }
          "dates remises : $n fichiers en $([int]$sw.Elapsed.TotalSeconds) s"
          # Sans commit de référence utilisable, nos sources (hors UE4SS) sont toutes marquées modifiées.
          $touchOurs = { Get-ChildItem native -Recurse -File | Where-Object FullName -notmatch 'third_party' | ForEach-Object { $_.LastWriteTimeUtc = [datetime]::UtcNow } }
          $marker = Join-Path $env:BUILD_DIR ".cache_commit"
          $base = if (Test-Path $marker) { (Get-Content $marker -Raw).Trim() } else { "" }
          if ($base) { git cat-file -e "$base^{commit}" 2>$null }
          if ($base -and $LASTEXITCODE -eq 0) {
            $changed = @(git diff --name-only $base HEAD -- native)
            "cache du commit $base ; fichiers modifiés depuis : $($changed.Count)"
            foreach ($c in $changed) { if (Test-Path $c) { (Get-Item $c).LastWriteTimeUtc = [datetime]::UtcNow; "  $c" } }
          } else {
            "pas de commit de référence dans le cache : toutes nos sources sont recompilées (UE4SS reste en cache)"
            & $touchOurs
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64, vsversion: "18" }
      - uses: jwlawson/actions-setup-cmake@v2
        with: { cmake-version: "latest" }
      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: |
          $env:FETCHCONTENT_BASE_DIR = "${{ github.workspace }}/build_deps/_deps"
          cmake -S native -B $env:BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE="$env:BUILD_MODE" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: |
          cmake --build $env:BUILD_DIR --target UE4SS proxy E33Coop

      - name: Stage
        run: |
          $f = { param($n) Get-ChildItem $env:BUILD_DIR -Recurse -Filter $n | Where-Object FullName -notlike '*_deps*' | Select-Object -First 1 }
          New-Item -ItemType Directory -Force pkg/ue4ss/Mods/E33Coop/dlls | Out-Null
          Copy-Item (& $f dwmapi.dll).FullName pkg/
          Copy-Item (& $f UE4SS.dll).FullName pkg/ue4ss/
          Copy-Item (& $f E33Coop.dll).FullName pkg/ue4ss/Mods/E33Coop/dlls/main.dll
          $pdb = & $f E33Coop.pdb; if ($pdb) { Copy-Item $pdb.FullName pkg/ue4ss/Mods/E33Coop/dlls/main.pdb }
          $ver = (Get-Content VERSION -Raw).Trim()
          [IO.File]::WriteAllText("$PWD/pkg/ue4ss/Mods/E33Coop/version.txt", $ver)
          "version=$ver`nue4ss=$(git -C native/third_party/RE-UE4SS rev-parse HEAD)`nmod=${{ github.sha }}" | Set-Content pkg/build-info.txt
          # commit de cet état de build, pour le prochain build incrémental
          "${{ github.sha }}" | Set-Content (Join-Path $env:BUILD_DIR ".cache_commit")
          Get-ChildItem pkg -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: e33coop-mod
          path: pkg/
          retention-days: 14
